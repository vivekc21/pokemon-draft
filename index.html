<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pokémon All‑22 Draft</title>
<style>
:root{--bg:#0f1220;--card:#1a1f35;--card2:#232a47;--txt:#eef1ff;--mut:#9aa3c7;--acc:#ffcb05;--acc2:#3d7dca;--bad:#e3350d}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:radial-gradient(circle at 20% 0,#1d2550,#0f1220 60%);color:var(--txt);min-height:100vh}
header{display:flex;align-items:center;gap:12px;padding:12px 18px;background:#0b0e1acc;position:sticky;top:0;z-index:5;backdrop-filter:blur(6px);border-bottom:1px solid #2a3260}
header h1{font-size:20px;margin:0;flex:1}header h1 span{color:var(--acc)}
button{font:inherit;border:0;border-radius:10px;padding:9px 14px;background:var(--acc2);color:#fff;cursor:pointer;font-weight:600}
button.y{background:var(--acc);color:#222}button.g{background:#2b3358}button.r{background:var(--bad)}button:disabled{opacity:.4;cursor:not-allowed}
input,select{font:inherit;padding:9px 11px;border-radius:10px;border:1px solid #333c6b;background:#11152a;color:var(--txt)}
main{padding:16px;max-width:1400px;margin:auto}.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 6px 24px #0005}
.setup{max-width:620px;margin:20px auto}.setup label{display:block;margin:12px 0 4px;color:var(--mut);font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.players input{flex:1;min-width:0}
.layout{display:grid;grid-template-columns:1fr 420px;gap:16px}@media(max-width:900px){.layout{grid-template-columns:1fr}}
.turn{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;background:linear-gradient(90deg,#ffcb0522,transparent);border-left:4px solid var(--acc)}
.turn b{color:var(--acc);font-size:22px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.filters input{flex:1;min-width:160px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.mon{background:var(--card2);border-radius:12px;padding:8px;text-align:center;cursor:pointer;transition:.15s;border:2px solid transparent;position:relative}
.mon:hover{transform:translateY(-2px);border-color:var(--acc)}.mon img{width:80px;height:80px;image-rendering:pixelated}
.mon .n{font-weight:600;font-size:13px;text-transform:capitalize}.mon .id{color:var(--mut);font-size:11px}
.mon.taken{opacity:.28;filter:grayscale(1);cursor:default;transform:none;border-color:transparent}
.mon.taken .by{position:absolute;top:6px;left:6px;right:6px;font-size:10px;background:#000a;border-radius:6px;padding:2px;filter:none}
.types{display:flex;gap:3px;justify-content:center;flex-wrap:wrap;margin-top:4px}.t{font-size:10px;padding:2px 6px;border-radius:6px;text-transform:uppercase;font-weight:700;color:#fff}
.board{display:flex;flex-direction:column;gap:12px}.team h3{margin:0 0 8px;display:flex;justify-content:space-between}.team.on{outline:3px solid var(--acc)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
.slot{background:#11152a;border-radius:8px;padding:4px;font-size:11px;text-align:center;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.slot .p{color:var(--acc);font-weight:700;font-size:10px}.slot img{width:44px;height:44px}.slot .nm{text-transform:capitalize}
.side{font-size:12px;color:var(--mut);margin:6px 0 4px;text-transform:uppercase;letter-spacing:1px}
.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:10;padding:16px}
.modal .card{max-width:520px;width:100%;max-height:90vh;overflow:auto}.modal img.big{width:120px;height:120px;display:block;margin:auto}
.posbtns{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:6px;margin-top:10px}.posbtns button{padding:8px 4px;font-size:13px}
.log{font-size:12px;color:var(--mut);max-height:140px;overflow:auto}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--acc);color:#222;padding:10px 16px;border-radius:10px;font-weight:600;z-index:20}
.field{background:repeating-linear-gradient(0deg,#1f6b34 0 40px,#237a3b 40px 80px);border-radius:16px;padding:14px;border:3px solid #fff3}
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}.muted{color:var(--mut)}
.chip{display:inline-block;padding:3px 8px;border-radius:999px;background:#2b3358;font-size:12px;margin:2px}
.bst{font-size:11px;color:var(--mut);margin-top:4px}.bst b{color:var(--acc)}
.info{position:absolute;top:4px;right:4px;padding:2px 7px;font-size:13px;background:#0006;border-radius:8px}.mon.taken .info{filter:none;opacity:1}
.stats{display:grid;grid-template-columns:70px 1fr 36px;gap:5px 8px;align-items:center;font-size:13px;margin:8px 0}.bar{background:#11152a;border-radius:6px;height:10px;overflow:hidden}.bar i{display:block;height:100%}
.tstats{margin:-4px 0 8px}.tstats .chip{font-size:11px;padding:2px 6px}
input[type=checkbox]{flex:0 0 auto;width:auto;padding:0;margin-right:6px}.filters label.chip{display:flex;align-items:center}
</style></head><body>
<header><h1>⚡ Pokémon <span>All‑22</span> Draft</h1><div class="row" id="hdr"></div></header>
<main id="app"><p class="muted">Loading…</p></main>
<script>
const TYPES=["normal","fire","water","grass","electric","ice","fighting","poison","ground","flying","psychic","bug","rock","ghost","dragon","dark","steel","fairy"];
const TC={normal:"#9a9a78",fire:"#e8732c",water:"#5d8ee8",grass:"#6cbf45",electric:"#e6c11f",ice:"#86cfcf",fighting:"#b82d25",poison:"#9a3d9a",ground:"#cfa956",flying:"#9b86e8",psychic:"#f2537f",bug:"#a1b11f",rock:"#b19a35",ghost:"#6c5894",dragon:"#6a37f2",dark:"#6c5848",steel:"#a8a8c4",fairy:"#e78fb0"};
const GENS=[[1,151],[152,251],[252,386],[387,493],[494,649],[650,721],[722,809],[810,905],[906,1025]];
const LEG=new Set([144,145,146,150,151,243,244,245,249,250,251,377,378,379,380,381,382,383,384,385,386,480,481,482,483,484,485,486,487,488,489,490,491,492,493,494,638,639,640,641,642,643,644,645,646,647,648,649,716,717,718,719,720,721,772,773,785,786,787,788,789,790,791,792,800,801,802,807,808,809,888,889,890,891,892,893,894,895,896,897,898,905,1001,1002,1003,1004,1007,1008,1014,1015,1016,1017,1024,1025]);
const OFF=["QB","RB","WR1","WR2","WR3","TE","LT","LG","C","RG","RT"],DEF=["DE1","DT1","DT2","DE2","OLB1","MLB","OLB2","CB1","CB2","FS","SS"];
const ALL22=[...OFF,...DEF];
const gen=id=>GENS.findIndex(([a,b])=>id>=a&&id<=b)+1;
const spr=id=>`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png`;
const art=id=>`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${id}.png`;
let POKE=[],S=null,view=false,F={q:"",type:"",gen:""},pending=null;
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const toast=m=>{const d=document.createElement("div");d.className="toast";d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2000)};
async function loadPoke(){
 const c=localStorage.getItem("pkdraft_pool_v2");if(c){POKE=JSON.parse(c);return}
 const list=await (await fetch("https://pokeapi.co/api/v2/pokemon?limit=1025")).json();
 const map={};list.results.forEach(r=>{const id=+r.url.split("/").slice(-2)[0];map[id]={id,name:r.name,types:[]}});
 await Promise.all(TYPES.map(async t=>{const d=await (await fetch("https://pokeapi.co/api/v2/type/"+t)).json();
  d.pokemon.forEach(p=>{const id=+p.pokemon.url.split("/").slice(-2)[0];if(map[id])map[id].types[p.slot-1]=t})}));
 POKE=Object.values(map).map(p=>({...p,types:p.types.filter(Boolean),name:p.name.replace(/-(normal|average|male|ordinary|aria|altered|land|red-striped|incarnate|standard|50|midday|solo|disguised|amped|full-belly|single-strike|baile|plant|shield|curly|two-segment|family-of-four|zero|green-plumage|ice|east)$/,"")})).sort((a,b)=>a.id-b.id);
 try{const g=await (await fetch("https://beta.pokeapi.co/graphql/v1beta",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({query:"{pokemon_v2_pokemon(where:{id:{_lte:1025}}){id height weight pokemon_v2_pokemonstats{base_stat stat_id}}}"})})).json();
  const sm={};g.data.pokemon_v2_pokemon.forEach(x=>{const s=[0,0,0,0,0,0];x.pokemon_v2_pokemonstats.forEach(t=>s[t.stat_id-1]=t.base_stat);sm[x.id]={h:x.height,w:x.weight,s}});
  POKE.forEach(p=>Object.assign(p,sm[p.id]||{}))}catch(e){console.warn("stats bulk failed",e);return}
 localStorage.setItem("pkdraft_pool_v2",JSON.stringify(POKE));
}
const SN=["HP","Atk","Def","SpA","SpD","Spe"],SL=["HP","Attack","Defense","Sp. Atk","Sp. Def","Speed"];
const bst=p=>p.s?p.s.reduce((a,b)=>a+b,0):0;
async function ensureStats(p){if(p.s)return;try{const d=await (await fetch("https://pokeapi.co/api/v2/pokemon/"+p.id)).json();p.h=d.height;p.w=d.weight;p.s=d.stats.map(x=>x.base_stat)}catch(e){}}
const fmtHW=p=>p.s?`${(p.h/10).toFixed(1)} m · ${(p.w/10).toFixed(1)} kg`:"";
function teamStats(i){const ps=S.picks.filter(x=>x.p===i).map(x=>P(x.id)).filter(p=>p&&p.s);const t=[0,0,0,0,0,0];ps.forEach(p=>p.s.forEach((v,k)=>t[k]+=v));
 return `<div class="tstats"><span class="chip"><b>BST ${t.reduce((a,b)=>a+b,0)}</b></span>${t.map((v,k)=>`<span class="chip">${SN[k]} ${v}</span>`).join("")}${ps.length?`<span class="chip">Avg BST ${Math.round(t.reduce((a,b)=>a+b,0)/ps.length)}</span>`:""}</div>`}
const P=id=>POKE[id-1]||POKE.find(p=>p.id===id);
// state: {players:[], size, order:'snake'|'linear', mode:'all22'|'classic', gens:[1], noLeg:true, picks:[{p:playerIdx,id,slot}]}
const slotsOf=()=>S.mode==="all22"?ALL22:Array.from({length:S.size},(_,i)=>"#"+(i+1));
const total=()=>S.players.length*slotsOf().length;
function who(n){const k=S.players.length,r=Math.floor(n/k),i=n%k;return S.order==="snake"&&r%2?k-1-i:i}
const save=()=>{localStorage.setItem("pkdraft_state",JSON.stringify(S));if(ROOM&&S)localStorage.setItem("pkdraft_room_"+ROOM,JSON.stringify(S));};
// ---------- Multiplayer: shared ordered op-log on ntfy.sh (no account, no keys) ----------
// Every client applies the same ops in the same server order. An op is accepted only if its
// base version equals the current version (compare-and-set), so the first write wins everywhere.
let ROOM=null,ISHOST=false,HK=null,SEAT=null,OVR=false,LIVE=false,V=0,es=null,seen=new Set(),mine=new Map(),lastId="all",pollT=null;
const NTFY="https://ntfy.sh/",TOPIC=()=>"pkdraft-v1-"+ROOM;
const mkCode=()=>Array.from({length:6},()=>"ABCDEFGHJKMNPQRSTUVWXYZ23456789"[Math.floor(Math.random()*31)]).join("");
const joinURL=()=>location.origin+location.pathname+"?room="+ROOM;
const seatKey=()=>"pkdraft_seat_"+ROOM;
const packS=o=>o&&{...o,picks:o.picks.map(x=>[x.p,x.id,x.slot])},unpackS=o=>o&&{...o,picks:o.picks.map(([p,id,slot])=>({p,id,slot}))};
function setSeat(v){SEAT=v;localStorage.setItem(seatKey(),v);render()}
function applyOp(op,seat,host){
 if(op.t==="setup"){if(S&&!host)return "Only the host can change setup";S={...op.S,picks:op.S.picks||[],host:S&&S.host||op.hk};return null}
 if(op.t==="new"){if(!host)return "Only the host can start over";S=null;return null}
 if(!S)return "No draft";const n=S.picks.length,cur=who(n);
 if(op.t==="pick"){if(n>=total())return "Draft is complete";
  if(!(seat===cur||(host&&(op.ovr||!ROOM))))return "It's "+S.players[cur]+"'s turn";
  if(S.picks.some(x=>x.id===op.id))return "Already taken";
  if(S.picks.some(x=>x.p===cur&&x.slot===op.slot)||!slotsOf().includes(op.slot))return "Slot not available";
  const p=P(op.id);if(!p||!inPool(p))return "Not in pool";
  S.picks.push({p:cur,id:op.id,slot:op.slot});return null}
 if(op.t==="undo"){if(!n)return "Nothing to undo";const last=S.picks[n-1];if(!(host||seat===last.p))return "Only the host or the player who picked can undo";S.picks.pop();return null}
 return "Bad op"}
const isHostOp=op=>!!(op.hk&&(!S||!S.host||op.hk===S.host));
function commit(op){
 if(!ROOM){const e=applyOp(op,-9,true);if(e)return toast(e);save();if(!S)localStorage.removeItem("pkdraft_state");render();return}
 if(ISHOST)op.hk=HK;op.seat=SEAT;
 const bak=JSON.stringify(S),e=applyOp(op,SEAT,isHostOp(op));S=JSON.parse(bak);if(e)return toast(e); // pre-check only
 const rid=Math.random().toString(36).slice(2);mine.set(rid,op);
 fetch(NTFY+TOPIC(),{method:"POST",body:JSON.stringify({v:V,rid,op})}).then(r=>{if(!r.ok)throw r.status}).catch(err=>{mine.delete(rid);toast("Couldn't send — check connection ("+err+")")})}
function handle(m){if(m.event!=="message"||seen.has(m.id))return;seen.add(m.id);lastId=m.id;let d;try{d=JSON.parse(m.message)}catch(e){return}
 const was=mine.get(d.rid);mine.delete(d.rid);
 if(d.v!==V){if(was)toast("Too slow — someone else moved first");return}
 const e=applyOp(d.op,d.op.seat,isHostOp(d.op));if(e){if(was)toast(e);return}
 V++;save();if(document.querySelector(".modal")&&!was)document.querySelector(".modal:not(.keep)")?.remove();render()}
async function subscribe(){await poll(); // replay the log in order first, then stream what comes after it
 es&&es.close();es=new EventSource(NTFY+TOPIC()+"/sse?since="+lastId);
 es.onopen=()=>{LIVE=true;clearInterval(pollT);pollT=null;render()};
 // SSE fan-out order can differ per client, so it is only a wake-up signal; the cached log
 // (read by poll) is the single canonical order everyone applies. The cache is written in
 // small batches, so retry briefly until the new message shows up there.
 es.onmessage=e=>{let id;try{id=JSON.parse(e.data).id}catch(x){}let k=0;const go=async()=>{await poll();if(id&&!seen.has(id)&&++k<12)setTimeout(go,350)};go()};
 es.onerror=()=>{if(LIVE){LIVE=false;render()}if(!pollT)pollT=setInterval(poll,1500)}}
let polling=false,again=false;async function poll(){if(polling){again=true;return}polling=true;try{do{again=false;const t=await (await fetch(NTFY+TOPIC()+"/json?poll=1&since="+lastId,{cache:"no-store"})).text();t.split("\n").filter(Boolean).forEach(l=>handle(JSON.parse(l)))}while(again)}catch(e){}polling=false}
function joinRoom(code){ROOM=code;HK=localStorage.getItem("pkdraft_host_"+code);ISHOST=!!HK;const st=localStorage.getItem(seatKey());SEAT=st===null?null:+st;
 history.replaceState(null,"",location.pathname+"?room="+code);
 try{S=JSON.parse(localStorage.getItem("pkdraft_room_"+code))}catch(e){} // offline fallback until log replays
 const cached=S;S=null;V=0; // rebuild from shared log
 subscribe();setInterval(()=>{if(LIVE)poll()},10000);setTimeout(()=>{if(!LIVE&&V===0&&cached){S=cached;render();toast("Offline — showing saved copy")}},6000)}
function goLive(){const code=mkCode();HK=Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem("pkdraft_host_"+code,HK);
 localStorage.setItem("pkdraft_seat_"+code,SEAT===null?0:SEAT);const base=S;joinRoom(code);ISHOST=true;
 if(base){const NS={...base};delete NS.host;S=null;commit({t:"setup",S:NS})}
 inviteBox()}
function inviteBox(){const u=joinURL();navigator.clipboard?.writeText(u).catch(()=>{});const m=document.createElement("div");m.className="modal keep";
 m.innerHTML=`<div class="card" style="text-align:center"><h2>Room <span style="color:var(--acc);letter-spacing:3px">${ROOM}</span></h2><p class="muted">Send friends this link. They open it, tap their name, and see the live board.</p><input readonly value="${u}" style="width:100%" onclick="this.select()"><div class="row" style="justify-content:center;margin-top:12px"><button class="y" data-x>Done</button></div></div>`;
 m.onclick=e=>{if(e.target===m||e.target.dataset.x!==undefined)m.remove()};document.body.appendChild(m)}
const myTurn=()=>!ROOM||(S&&(SEAT===who(S.picks.length)||(ISHOST&&OVR)));
function seatPicker(){$("#app").innerHTML=`<div class="card setup" style="text-align:center"><h2>Room ${ROOM}</h2><p>Who are you?</p><div class="posbtns">${S.players.map((n,i)=>`<button onclick="setSeat(${i})">${esc(n)}</button>`).join("")}<button class="g" onclick="setSeat(-1)">👀 Spectate</button></div></div>`}
const enc=o=>btoa(unescape(encodeURIComponent(JSON.stringify({...o,picks:o.picks.map(x=>[x.p,x.id,x.slot])})))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const dec=s=>{const o=JSON.parse(decodeURIComponent(escape(atob(s.replace(/-/g,"+").replace(/_/g,"/")))));o.picks=o.picks.map(([p,id,slot])=>({p,id,slot}));return o};
function shareLink(){const u=location.href.split("#")[0]+"#d="+enc(S);navigator.clipboard?.writeText(u).then(()=>toast("Share link copied!"),()=>prompt("Copy this link:",u));if(!navigator.clipboard)prompt("Copy this link:",u)}
function hdr(){const h=$("#hdr");
 const live=ROOM?`<span class="chip" title="${LIVE?"connected":"connecting…"}">${LIVE?"🟢":"🟠"} Room <b>${ROOM}</b>${ISHOST?" · host":""}</span><button class="g" onclick="inviteBox()">Invite</button>${S?`<select onchange="setSeat(+this.value)" title="You are">${S.players.map((n,i)=>`<option value="${i}" ${SEAT===i?"selected":""}>${esc(n)}</option>`).join("")}<option value="-1" ${SEAT===-1?"selected":""}>Spectator</option></select>`:""}${ISHOST&&S?`<label class="chip"><input type="checkbox" ${OVR?"checked":""} onchange="OVR=this.checked;render()"> Host override</label>`:""}`:"";
 if(!S){h.innerHTML=live;return}
 if(ROOM){h.innerHTML=live+(ISHOST?`<button class="g" onclick="if(confirm('Start a new draft for everyone?'))commit({t:'new'})">New</button>`:"");return}
 h.innerHTML=view?`<span class="chip">👀 View-only</span><button class="g" onclick="importView()">Make it mine</button>`:
 `<button class="y" onclick="goLive()">🌐 Go live</button><button class="g" onclick="shareLink()">🔗 Snapshot</button><button class="g" onclick="if(confirm('Start a new draft?')){S=null;localStorage.removeItem('pkdraft_state');render()}">New</button>`}
function render(){hdr();if(ROOM&&!ISHOST&&!S){$("#app").innerHTML=`<div class="card setup">${LIVE?"Waiting for the host to set up the draft…":"Connecting to room "+ROOM+"… (the host's tab must be open)"}</div>`;return}if(ROOM&&S&&SEAT===null)return seatPicker();if(!S)return setup();if(S.picks.length>=total())return results();draft()}
function setup(){
 const pl=JSON.parse(localStorage.getItem("pkdraft_lastplayers")||'["",""]');
 $("#app").innerHTML=`<div class="card setup"><h2 style="margin-top:0">Set up your draft</h2>
 <p class="muted">Inspired by the “All 22 of Pokémon” — draft a full football lineup (11 offense + 11 defense) from the original 151, no legendaries. Or switch to a classic team.</p>
 <label>Players (2–8)</label><div id="pls"></div><button class="g" id="addp" style="margin-top:6px">+ Add player</button>
 <label>Format</label><select id="mode"><option value="all22">All‑22 football lineup (22 picks, choose positions)</option><option value="classic">Classic team</option></select>
 <div id="sz" style="display:none"><label>Team size</label><input id="size" type="number" min="1" max="30" value="6"></div>
 <label>Draft order</label><select id="order"><option value="snake">Snake (1→N, N→1)</option><option value="linear">Linear (1→N every round)</option></select>
 <label>Generations</label><div class="row" id="gens">${GENS.map((_,i)=>`<label class="chip"><input type="checkbox" value="${i+1}" ${i==0?"checked":""}> Gen ${i+1}</label>`).join("")}</div>
 <label class="chip" style="margin-top:10px"><input type="checkbox" id="noleg" checked> Exclude legendaries & mythicals</label>
 <div class="row" style="margin-top:16px"><button class="y" id="go">Start draft 🏈</button><button class="g" onclick="document.querySelectorAll('#pls input').forEach(i=>i.value='');shuffle()" style="display:none"></button><label class="chip"><input type="checkbox" id="rand"> Randomize order</label>${ROOM?"":`<label class="chip"><input type="checkbox" id="live" checked> 🌐 Live room for friends</label>`}</div></div>`;
 const pls=$("#pls");const addP=v=>{if(pls.children.length>=8)return;const d=document.createElement("div");d.className="row players";d.style.marginBottom="6px";d.innerHTML=`<input placeholder="Player ${pls.children.length+1}" value="${esc(v)}"><button class="g">✕</button>`;d.querySelector("button").onclick=()=>{if(pls.children.length>2)d.remove()};pls.appendChild(d)};
 pl.forEach(addP);$("#addp").onclick=()=>addP("");
 $("#mode").onchange=e=>$("#sz").style.display=e.target.value==="classic"?"":"none";
 $("#go").onclick=()=>{if(!$("#live")){const x=document.createElement("input");x.type="checkbox";x.id="live";x.hidden=true;document.body.appendChild(x)}let players=[...pls.querySelectorAll("input")].map((i,k)=>i.value.trim()||"Player "+(k+1));
  if(players.length<2)return toast("Need 2+ players");localStorage.setItem("pkdraft_lastplayers",JSON.stringify(players));
  if($("#rand").checked)players.sort(()=>Math.random()-.5);
  const gens=[...document.querySelectorAll("#gens input:checked")].map(i=>+i.value);if(!gens.length)return toast("Pick a generation");
  S={players,mode:$("#mode").value,size:Math.max(1,Math.min(30,+$("#size").value||6)),order:$("#order").value,gens,noLeg:$("#noleg").checked,picks:[]};
  const pool=POKE.filter(inPool).length;if(pool<total())return toast(`Pool has only ${pool} Pokémon for ${total()} picks`);
  const NS=S;S=null;view=false;const live=$("#live").checked;commit({t:"setup",S:NS});if(live&&!ROOM)goLive()};
}
const inPool=p=>S.gens.includes(gen(p.id))&&!(S.noLeg&&LEG.has(p.id));
const typeChips=ts=>`<div class="types">${ts.map(t=>`<span class="t" style="background:${TC[t]}">${t}</span>`).join("")}</div>`;
function teamHTML(i,big){const sl=slotsOf(),mine=S.picks.filter(x=>x.p===i),cell=s=>{const k=mine.find(x=>x.slot===s);const pk=k&&P(k.id);
  return `<div class="slot"><div class="p">${s.replace(/\d$/,"")}</div>${pk?`<img src="${spr(pk.id)}" loading="lazy" alt=""><div class="nm">${esc(pk.name)}</div>`:`<div class="muted">—</div>`}</div>`};
 const body=S.mode==="all22"?`<div class="side">Offense</div><div class="slots">${OFF.map(cell).join("")}</div><div class="side">Defense</div><div class="slots">${DEF.map(cell).join("")}</div>`:`<div class="slots">${sl.map(cell).join("")}</div>`;
 return `<div class="card team ${!big&&who(S.picks.length)===i?"on":""}"><h3><span>${esc(S.players[i])}</span><span class="muted" style="font-size:13px">${mine.length}/${sl.length}</span></h3>${teamStats(i)}${big&&S.mode==="all22"?`<div class="field">${body}</div>`:body}</div>`}
function draft(){
 const n=S.picks.length,cur=who(n),k=S.players.length,round=Math.floor(n/k)+1,taken=new Map(S.picks.map(x=>[x.id,x.p]));
 $("#app").innerHTML=`<div class="layout"><div>
 <div class="card turn"><div><div class="muted">Round ${round} · Pick ${n+1} of ${total()}</div><div>On the clock: <b>${esc(S.players[cur])}</b></div><div class="muted" style="font-size:12px">Next: ${[1,2,3].map(j=>n+j<total()?esc(S.players[who(n+j)]):null).filter(Boolean).join(" → ")||"—"}</div></div>
 <div class="row">${view?"":`<button class="g" id="undo" ${n?"":"disabled"}>↶ Undo</button><button class="g" id="rnd" ${myTurn()?"":"disabled"}>🎲 Random pick</button>`}</div></div>${ROOM?`<div class="muted" style="margin:-6px 0 10px">${myTurn()?(SEAT===cur?"🟡 You're on the clock!":"Host override: picking for "+esc(S.players[cur])):"Waiting for "+esc(S.players[cur])+"…"}</div>`:""}
 <div class="filters"><input id="q" placeholder="Search name or #…" value="${esc(F.q)}"><select id="ft"><option value="">All types</option>${TYPES.map(t=>`<option ${F.type===t?"selected":""}>${t}</option>`).join("")}</select>
 <select id="fg"><option value="">All gens</option>${S.gens.map(g=>`<option value="${g}" ${F.gen==g?"selected":""}>Gen ${g}</option>`).join("")}</select>
 <select id="fs"><option value="">Sort: Dex #</option><option value="bst">Sort: Base stat total</option>${SL.map((l,k)=>`<option value="${k}">Sort: ${l}</option>`).join("")}<option value="h">Sort: Height</option><option value="w">Sort: Weight</option></select>
 <label class="chip"><input type="checkbox" id="hide" ${F.hide?"checked":""}> Hide picked</label></div>
 <div class="grid" id="grid"></div></div>
 <div class="board">${S.players.map((_,i)=>teamHTML(i)).join("")}<div class="card"><b>Pick log</b><div class="log">${S.picks.map((x,j)=>`${j+1}. ${esc(S.players[x.p])} — ${esc(P(x.id).name)} (${x.slot})`).reverse().join("<br>")||"No picks yet"}</div></div></div></div>`;
 const grid=()=>{const q=F.q.toLowerCase().trim();const list=POKE.filter(p=>inPool(p)&&(!q||p.name.includes(q)||String(p.id)===q.replace("#",""))&&(!F.type||p.types.includes(F.type))&&(!F.gen||gen(p.id)==F.gen)&&!(F.hide&&taken.has(p.id)));
  if(F.sort){const v=p=>F.sort==="bst"?bst(p):F.sort==="h"?p.h||0:F.sort==="w"?p.w||0:(p.s?p.s[+F.sort]:0);list.sort((a,b)=>v(b)-v(a)||a.id-b.id)}
  $("#grid").innerHTML=list.map(p=>{const t=taken.has(p.id);return `<div class="mon ${t?"taken":""}" data-id="${p.id}">${t?`<div class="by">${esc(S.players[taken.get(p.id)])}</div>`:""}<img src="${spr(p.id)}" loading="lazy" alt=""><div class="n">${esc(p.name)}</div><div class="id">#${String(p.id).padStart(3,"0")}</div>${typeChips(p.types)}${p.s?`<div class="bst">BST <b>${bst(p)}</b>${F.sort&&F.sort!=="bst"?` · ${F.sort==="h"?(p.h/10)+"m":F.sort==="w"?(p.w/10)+"kg":SN[+F.sort]+" "+p.s[+F.sort]}`:""}</div>`:""}<button class="info" data-info="${p.id}" title="Stats">ⓘ</button></div>`}).join("")||`<p class="muted">No Pokémon match.</p>`};
 grid();
 $("#q").oninput=e=>{F.q=e.target.value;grid()};$("#ft").onchange=e=>{F.type=e.target.value;grid()};$("#fg").onchange=e=>{F.gen=e.target.value;grid()};$("#fs").value=F.sort||"";$("#fs").onchange=e=>{F.sort=e.target.value;grid()};$("#hide").onchange=e=>{F.hide=e.target.checked;grid()};
 $("#grid").onclick=e=>{const ib=e.target.closest("[data-info]");if(ib)return openPick(+ib.dataset.info,true);const m=e.target.closest(".mon");if(!m||m.classList.contains("taken")||view)return;openPick(+m.dataset.id)};
 if(!view){$("#undo").onclick=()=>commit({t:"undo"});
  $("#rnd").onclick=()=>{const av=POKE.filter(p=>inPool(p)&&!taken.has(p.id));openPick(av[Math.floor(Math.random()*av.length)].id)}}
}
async function openPick(id,info){const p=P(id);await ensureStats(p);if(view||!myTurn()||S.picks.some(x=>x.id===id))info=true;const cur=who(S.picks.length),used=new Set(S.picks.filter(x=>x.p===cur).map(x=>x.slot)),open=slotsOf().filter(s=>!used.has(s));
 const m=document.createElement("div");m.className="modal";
 m.innerHTML=`<div class="card"><img class="big" src="${art(id)}" onerror="this.src='${spr(id)}'"><h2 style="text-align:center;text-transform:capitalize;margin:6px 0">${esc(p.name)} <span class="muted">#${id}</span></h2>${typeChips(p.types)}
 ${p.s?`<p class="muted" style="text-align:center;margin:6px">${fmtHW(p)}</p><div class="stats">${p.s.map((v,k)=>`<div>${SL[k]}</div><div class="bar"><i style="width:${Math.min(100,v/2.55)}%;background:${v>=100?"#4caf50":v>=70?"#ffcb05":"#e3350d"}"></i></div><div>${v}</div>`).join("")}<div><b>Total</b></div><div></div><div><b>${bst(p)}</b></div></div>`:""}
 ${info?"":`<p style="text-align:center">${esc(S.players[cur])}, ${S.mode==="all22"?"pick a position:":"confirm your pick:"}</p>
 <div class="posbtns">${S.mode==="all22"?open.map(s=>`<button data-s="${s}">${s}</button>`).join(""):`<button class="y" data-s="${open[0]}">Draft ${esc(p.name)}</button>`}</div>`}
 <div class="row" style="justify-content:center;margin-top:12px"><button class="g" data-x>${info?"Close":"Cancel"}</button></div></div>`;
 m.onclick=e=>{if(e.target===m||e.target.dataset.x!==undefined)return m.remove();const s=e.target.dataset.s;if(!s)return;m.remove();commit({t:"pick",id,slot:s,ovr:ISHOST&&OVR})};
 document.body.appendChild(m)}
function results(){$("#app").innerHTML=`<div class="card turn"><div><b>🏆 Draft complete!</b><div class="muted">${total()} picks · ${S.order} draft · ${S.mode==="all22"?"All‑22 lineups":"teams of "+S.size}</div></div><div class="row">${view?"":`<button class="g" onclick="commit({t:'undo'})">↶ Undo last pick</button>`}<button class="y" onclick="shareLink()">🔗 Share results</button></div></div>
 <div class="results">${S.players.map((_,i)=>teamHTML(i,true)).join("")}</div>`}
function importView(){view=false;save();history.replaceState(null,"",location.pathname);render()}
(async()=>{try{await loadPoke()}catch(e){$("#app").innerHTML=`<div class="card">Couldn't load Pokémon from PokeAPI. Check your connection and reload.</div>`;return}
 const h=location.hash.match(/#d=(.+)/);if(h){try{S=dec(h[1]);view=true}catch(e){toast("Bad share link")}}
 const rm=new URLSearchParams(location.search).get("room");if(rm&&!h)joinRoom(rm.toUpperCase().trim());
 if(!S&&!ROOM){try{S=JSON.parse(localStorage.getItem("pkdraft_state"))}catch(e){}}render()})();
</script></body></html>
